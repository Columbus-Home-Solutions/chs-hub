# Cloudflare Worker configuration for chs-hub
#
# Single Worker strategy (see public/docs/00-architecture.md §6 and chat):
#   - All served web assets live under ./public (docs site, dashboard, /app).
#   - API routes (/health, /api/*) are handled by src/index.ts
#   - Cloudflare's asset pipeline serves matching files directly; unmatched
#     requests fall through to the Worker, which either answers or delegates
#     back to env.ASSETS.
#
# Docs: https://developers.cloudflare.com/workers/static-assets/

name = "chs-hub"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

# ─── Static assets ─────────────────────────────────────────────────────
# `directory = "./public"` serves only the deployable web assets:
#   public/index.html + public/README.md + public/docs/  → docs viewer site
#   public/dashboard/                                     → dashboard (via host rewrite)
#   public/app/                                           → Preact app at /app (Vite build output)
# We intentionally do NOT set `not_found_handling` here — the Worker itself
# decides what to do with unmatched paths (either answer as an API route, or
# proxy back to env.ASSETS for docs-style content). Served URL paths are
# unchanged by the move (e.g. /dashboard/*, /app/*, /docs/*.md, /) because the
# asset binding treats `directory` as the web root.
#
# WHY ./public AND NOT ./ : with the assets root at the repo root, `wrangler dev`'s
# asset watcher watched the whole tree — including `.wrangler/state` (local D1/R2
# sqlite). Those WAL files churn on every request and retriggered the watcher,
# putting dev into an endless "Reloading local server" loop (cloudflare/workers-sdk#6881;
# the asset watcher has no ignore list and does not honor .assetsignore). Scoping
# the assets root to ./public keeps `.wrangler`, src/, frontend/, node_modules/
# OUT of the watched tree, so `wrangler dev` settles. Do NOT move it back to "./".

[assets]
directory = "./public"
binding = "ASSETS"
# Worker code runs FIRST so we can route by hostname (dash.* vs docs.*)
# before assets are served. Without this, Cloudflare would serve /index.html
# directly for dash.* and bypass the dashboard rewrite entirely.
run_worker_first = true

# ─── Custom domains ────────────────────────────────────────────────────
# docs.homesolutionsar.com is already configured in the Cloudflare dashboard
# as a Pages/Worker custom domain. We add dash.* here so the dashboard has
# its own hostname (also makes Cloudflare Access policy easy to target).
# The Worker's fetch handler rewrites dash.*/ → /dashboard/ internally.

[[routes]]
pattern = "dashboard.homesolutionsar.com"
custom_domain = true

# client.homesolutionsar.com is the NON-Access public host for customer-facing
# pay/quote pages (APP_PUBLIC_ORIGIN). The Worker's public-host routing guard
# (src/index.ts) restricts it to the token-gated public surface only; the token
# is the security boundary, so no Cloudflare Access policy is applied here.
[[routes]]
pattern = "client.homesolutionsar.com"
custom_domain = true

# ─── D1 database ───────────────────────────────────────────────────────
# Created via: wrangler d1 create chs-hub-db
# The database_id below is filled in after creation in Session 6a.

[[d1_databases]]
binding = "DB"
database_name = "chs-hub-db"
database_id = "bfcb169f-04ec-48d4-a07a-37a8d6f561e4"
migrations_dir = "migrations"

# ─── R2 bucket ─────────────────────────────────────────────────────────
# Created via: wrangler r2 bucket create chs-hub-files

[[r2_buckets]]
binding = "FILES"
bucket_name = "chs-hub-files"

# ─── Non-secret config ─────────────────────────────────────────────────
# HL location ID is not sensitive (appears in HL's own URLs). Token is
# stored separately via `wrangler secret put HL_PRIVATE_TOKEN`.

[vars]
HL_LOCATION_ID = "lZ8L8FAf6K2niuHoFbaw"
# Set to "1" to disable real Resend sends (notify() will log to console
# instead). Useful while wiring up the Resend domain or for dev runs.
RESEND_DRY_RUN = "0"
# OAuth Web client ID (public; embedded in dashboard HTML). Must live here so
# `wrangler deploy` does not drop a dashboard-only var and break Connect Google.
# Google Cloud → APIs & Credentials → OAuth 2.0 Client IDs → Web client.
DASHBOARD_OAUTH_CLIENT_ID = "249005729817-b238l4929ql3vkst04f7kohoa14cpgch.apps.googleusercontent.com"
# Google Drive mirror — values must be folder/drive IDs only (from …/folders/ID), not full URLs.
DRIVE_SHARED_DRIVE_ID = "0AEkL6Jrv29twUk9PVA"
DRIVE_MIRROR_ROOT_FOLDER_ID = "1ZRJP1v8Ro3OrBoBWc2GppFnK3FKE8Ojf"
# ─── Notification engine (Sprint 7) ────────────────────────────────────
# Dispatch mode. "live" attempts real SMS/email when the channel's credentials
# are present (Twilio secrets / Resend key), and falls back to simulate when
# they're absent. ANYTHING ELSE (incl. this default) forces SIMULATE: render +
# log a notification_logs row marked external_id='simulated:<uuid>' WITHOUT
# touching Twilio/Resend. Default = simulate so local + any creds-less env never
# messages a real client. Twilio account/number + production Resend
# from-address are a Pre-Launch item; flip this to "live" only once they exist.
NOTIFICATIONS_DISPATCH_MODE = "simulate"
# Absolute origin used to build client-facing links ({{estimate_link}} →
# /quote/<token>, invoice pay links → /pay/<token>) in rendered notifications.
# This is the NON-Access public custom domain (DNS + custom_domain route added in
# Cloudflare); the worker's public-host routing guard (src/index.ts) restricts it
# to the token-gated public surface only.
APP_PUBLIC_ORIGIN = "https://client.homesolutionsar.com"
# Public file share links: `wrangler secret put FILE_LINK_SECRET` (32+ char random). Optional
#   var HUB_FILE_LINK_ORIGIN = "https://chs-hub.<account>.workers.dev" so /api/f?t=… works
#   for people without Cloudflare Access (the dashboard host may require Access).

# ─── Scheduled jobs ────────────────────────────────────────────────────
# All four schedules dispatch through src/index.ts → dispatchCron().
#
#   */30 * * * *  → Jobber → D1 sync + Wealthy Contractor workbook export
#   15 * * * *    → heartbeat check + DLQ replay (every hour at :15 to dodge
#                   the :00 / :30 sync windows)
#   15 7 * * *    → nightly D1 → R2 backup at 02:15 Central (07:15 UTC) +
#                   30-day retention sweep
#   0 12 * * *    → daily summary email at 07:00 Central (12:00 UTC)

#   */15 * * * *  → Notification Processor (Sprint 7): drain due queued
#                   notification_logs rows after recomputing time-based triggers
#                   (quote follow-ups, work_starting, appointment reminders)
#
# NOTE: the account is capped at 5 cron triggers (Workers Free plan limit). Sprint
# 9's invoice billing (late-fee accrual + due/past-due notices) therefore runs
# INSIDE the nightly "15 7 * * *" handler (see dispatchCron → runInvoiceBilling)
# rather than as a 6th "0 8 * * *" trigger.

[triggers]
crons = [
  "*/15 * * * *",
  "*/30 * * * *",
  "15 * * * *",
  "15 7 * * *",
  "0 12 * * *",
]

[observability]
enabled = true

# ─── Build command ──────────────────────────────────────────────────────────
# Runs BEFORE `wrangler deploy` regardless of who invokes it — local CLI or
# the Cloudflare GitHub integration. Keeps public/app/ (gitignored Vite output)
# populated so static assets are always uploaded with the worker code.
# The npm run deploy script delegates entirely to this; never call
# `npm run build:frontend && wrangler deploy` directly (it would build twice).
[build]
command = "bash scripts/build-frontend.sh"

# Drive mirror + Jobber full sync need many `fetch()`s and (on Paid) higher CPU for
# long crons. The `[limits]` block is Workers Paid–only; it breaks `wrangler deploy`
# on Free (API error re CPU / configurable caps). Uncomment after upgrading:
#
#   [limits]
#   subrequests = 10000
#   cpu_ms = 300000
#
# See https://developers.cloudflare.com/workers/platform/limits/
#
# On Free, invocations are capped (e.g. 50 subrequests, low CPU per run) — fine for
# smoke-testing routes and small jobs; a full Jobber + mirror pass may need Paid limits.
