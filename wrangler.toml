# Cloudflare Worker configuration for chs-hub
#
# Single Worker strategy (see docs/00-architecture.md §6 and chat):
#   - Static docs site is served from the repo root via [assets]
#   - API routes (/health, /api/*) are handled by src/index.ts
#   - Cloudflare's asset pipeline serves matching files directly; unmatched
#     requests fall through to the Worker, which either answers or delegates
#     back to env.ASSETS.
#
# Docs: https://developers.cloudflare.com/workers/static-assets/

name = "chs-hub"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

# ─── Static assets ─────────────────────────────────────────────────────
# `directory = "./"` serves everything in the repo that isn't listed in
# .assetsignore. We intentionally do NOT set `not_found_handling` here —
# the Worker itself decides what to do with unmatched paths (either answer
# as an API route, or proxy back to env.ASSETS for docs-style content).

[assets]
directory = "./"
binding = "ASSETS"
# Worker code runs FIRST so we can route by hostname (dash.* vs docs.*)
# before assets are served. Without this, Cloudflare would serve /index.html
# directly for dash.* and bypass the dashboard rewrite entirely.
run_worker_first = true

# ─── Custom domains ────────────────────────────────────────────────────
# docs.homesolutionsar.com is already configured in the Cloudflare dashboard
# as a Pages/Worker custom domain. We add dash.* here so the dashboard has
# its own hostname (also makes Cloudflare Access policy easy to target).
# The Worker's fetch handler rewrites dash.*/ → /dashboard/ internally.

[[routes]]
pattern = "dashboard.homesolutionsar.com"
custom_domain = true

# ─── D1 database ───────────────────────────────────────────────────────
# Created via: wrangler d1 create chs-hub-db
# The database_id below is filled in after creation in Session 6a.

[[d1_databases]]
binding = "DB"
database_name = "chs-hub-db"
database_id = "bfcb169f-04ec-48d4-a07a-37a8d6f561e4"
migrations_dir = "migrations"

# ─── R2 bucket ─────────────────────────────────────────────────────────
# Created via: wrangler r2 bucket create chs-hub-files

[[r2_buckets]]
binding = "FILES"
bucket_name = "chs-hub-files"

# ─── Non-secret config ─────────────────────────────────────────────────
# HL location ID is not sensitive (appears in HL's own URLs). Token is
# stored separately via `wrangler secret put HL_PRIVATE_TOKEN`.

[vars]
HL_LOCATION_ID = "lZ8L8FAf6K2niuHoFbaw"
# Set to "1" to disable real Resend sends (notify() will log to console
# instead). Useful while wiring up the Resend domain or for dev runs.
RESEND_DRY_RUN = "0"

# ─── Scheduled jobs ────────────────────────────────────────────────────
# All four schedules dispatch through src/index.ts → dispatchCron().
#
#   */30 * * * *  → Jobber → D1 sync + Wealthy Contractor workbook export
#   15 * * * *    → heartbeat check + DLQ replay (every hour at :15 to dodge
#                   the :00 / :30 sync windows)
#   15 7 * * *    → nightly D1 → R2 backup at 02:15 Central (07:15 UTC) +
#                   30-day retention sweep
#   0 12 * * *    → daily summary email at 07:00 Central (12:00 UTC)

[triggers]
crons = [
  "*/30 * * * *",
  "15 * * * *",
  "15 7 * * *",
  "0 12 * * *",
]

# ─── Observability ─────────────────────────────────────────────────────

[observability]
enabled = true
