<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#3D0C1F">
<title>Smart Notes — Columbus Home Solutions</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='10' fill='%233D0C1F'/><path d='M32 10 L54 28 L54 54 L10 54 L10 28 Z' fill='none' stroke='%23F0A500' stroke-width='3.5'/><rect x='24' y='36' width='16' height='18' rx='2' fill='%23F0A500'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --burg:#3D0C1F;--gold:#F0A500;--gold-lt:#FFB800;--orange:#C4391A;--orange-lt:#E8722A;
  --cream:#FFF8EC;--dark:#1A0508;--card:rgba(92,21,48,0.55);--bdr:rgba(240,165,0,0.22);
  --muted:rgba(255,248,236,0.55);--green:#52c07a;--red:#e05252;--blue:#5bc0eb;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{overflow-x:hidden;}
body{font-family:'Nunito',sans-serif;background:var(--dark);color:var(--cream);min-height:100vh;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 15% 0%,rgba(196,57,26,.18) 0%,transparent 55%),radial-gradient(ellipse at 85% 100%,rgba(240,165,0,.11) 0%,transparent 55%);pointer-events:none;z-index:0;}

/* HEADER */
header{position:relative;z-index:10;background:linear-gradient(135deg,var(--burg) 0%,#2A0812 100%);border-bottom:2px solid var(--gold);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:72px;box-shadow:0 4px 28px rgba(0,0,0,.5);}
.hl{display:flex;align-items:center;gap:16px;}
.back{color:var(--gold);text-decoration:none;font-size:14px;font-weight:700;padding:8px 14px;border:1px solid rgba(240,165,0,.35);border-radius:8px;background:rgba(240,165,0,.08);transition:all .2s;}
.back:hover{background:rgba(240,165,0,.2);}
.bn{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;color:var(--gold);}
.bt{font-size:10px;color:var(--orange-lt);letter-spacing:3px;text-transform:uppercase;font-weight:700;}
.hr{display:flex;align-items:center;gap:10px;}
.rfb{background:rgba(240,165,0,.14);border:1px solid rgba(240,165,0,.4);color:var(--gold);width:32px;height:32px;border-radius:50%;cursor:pointer;font-family:'Nunito',sans-serif;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:all .2s;padding:0;}
.rfb:hover{background:rgba(240,165,0,.28);}
.rfb.spin .rfb-ico{animation:chsSpin .9s linear infinite;display:inline-block;}
.rfb.ok{background:rgba(82,192,122,.22)!important;border-color:rgba(82,192,122,.55)!important;color:var(--green)!important;}
@keyframes chsSpin{to{transform:rotate(360deg);}}

main{position:relative;z-index:1;padding:18px;max-width:1600px;margin:0 auto;}

/* WRITE AREA */
.write{background:var(--card);border:1px solid var(--bdr);border-radius:13px;padding:14px 16px;backdrop-filter:blur(6px);margin-bottom:14px;}
.write h2{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1.8px;color:var(--gold);margin-bottom:10px;}
.w-input{width:100%;background:rgba(0,0,0,.28);border:1px solid rgba(240,165,0,.2);border-radius:9px;color:var(--cream);font-family:'Nunito',sans-serif;font-size:13px;padding:10px 12px;resize:vertical;min-height:90px;outline:none;line-height:1.5;}
.w-input:focus{border-color:rgba(240,165,0,.5);}
.w-row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap;}
.w-cat{background:rgba(0,0,0,.3);border:1px solid rgba(240,165,0,.22);border-radius:7px;color:var(--cream);font-family:'Nunito',sans-serif;font-size:12px;padding:8px 10px;outline:none;}
.w-btn{border:none;border-radius:8px;font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;padding:8px 18px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .2s;white-space:nowrap;}
.w-btn.primary{background:linear-gradient(135deg,var(--gold),var(--orange-lt));color:var(--dark);}
.w-btn.primary:hover{filter:brightness(1.1);}
.w-btn.secondary{background:rgba(255,255,255,.08);color:var(--cream);border:1px solid rgba(255,255,255,.15);font-weight:600;}
.w-btn.secondary:hover{background:rgba(255,255,255,.16);}
.w-btn[disabled]{opacity:.55;cursor:not-allowed;}
.w-progress{display:none;margin-top:10px;background:rgba(240,165,0,.08);border:1px solid rgba(240,165,0,.2);border-radius:9px;padding:10px 12px;}
.w-progress.open{display:block;}
.w-bar{background:rgba(0,0,0,.25);height:4px;border-radius:4px;overflow:hidden;margin-top:6px;}
.w-bar-fill{height:100%;width:0%;background:var(--gold);transition:width .4s;}
.w-result{display:none;margin-top:10px;background:rgba(0,0,0,.22);border:1px solid rgba(240,165,0,.17);border-radius:9px;padding:11px 13px;}
.w-result.open{display:block;}
.w-result h4{font-size:9px;letter-spacing:1.8px;color:var(--muted);text-transform:uppercase;margin-bottom:6px;font-weight:800;}
.w-result p{font-size:13px;color:var(--cream);line-height:1.5;margin-bottom:8px;}
.task-chip{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.2);border-radius:6px;padding:5px 8px;margin-bottom:4px;font-size:12px;}
.task-chip .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}

/* FILTERS */
.filters{background:var(--card);border:1px solid var(--bdr);border-radius:11px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;backdrop-filter:blur(6px);}
.f-lbl{font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);}
.f-sel,.f-in{background:rgba(20,4,10,.75);border:1px solid rgba(240,165,0,.25);color:var(--cream);padding:7px 11px;border-radius:7px;font-family:'Nunito',sans-serif;font-size:13px;outline:none;}
.f-sel:focus,.f-in:focus{border-color:var(--gold);}
.f-in{min-width:220px;}
.f-tab{background:rgba(240,165,0,.1);border:1px solid rgba(240,165,0,.3);color:var(--gold);padding:6px 14px;border-radius:20px;cursor:pointer;font-size:12px;font-weight:700;transition:all .2s;}
.f-tab.active{background:var(--gold);color:var(--dark);}
.f-tab:hover:not(.active){background:rgba(240,165,0,.22);}
.f-spacer{flex:1;}
.f-btn{background:rgba(240,165,0,.14);border:1px solid rgba(240,165,0,.4);color:var(--gold);padding:7px 14px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:700;transition:all .2s;}
.f-btn.danger{background:rgba(224,82,82,.1);border-color:rgba(224,82,82,.3);color:var(--red);}
.f-btn:hover{background:rgba(240,165,0,.26);}
.f-btn.danger:hover{background:rgba(224,82,82,.22);}

/* GRID OF NOTES */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px;}
.ncard{background:var(--card);border:1px solid rgba(240,165,0,.18);border-radius:11px;padding:11px 13px;cursor:pointer;transition:all .2s;backdrop-filter:blur(6px);position:relative;overflow:hidden;}
.ncard:hover{border-color:rgba(240,165,0,.45);transform:translateY(-1px);}
.ncard.archived{opacity:.65;}
.ncard-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:8px;flex-wrap:wrap;}
.cat-pill{display:inline-block;font-size:9px;font-weight:800;padding:2px 9px;border-radius:20px;letter-spacing:.5px;}
.cat-Job{background:rgba(91,192,235,.16);color:var(--blue);}
.cat-Admin{background:rgba(180,120,235,.18);color:#b478eb;}
.cat-Finance{background:rgba(82,192,122,.16);color:var(--green);}
.cat-Follow\ Up{background:rgba(232,114,42,.16);color:var(--orange-lt);}
.cat-Marketing{background:rgba(235,92,168,.18);color:#eb5ca8;}
.cat-Personal{background:rgba(91,230,220,.16);color:#5be6dc;}
.cat-Meeting{background:rgba(240,165,0,.18);color:var(--gold);}
.cat-General{background:rgba(255,248,236,.1);color:var(--cream);}
.ncard-meta{font-size:10px;color:var(--muted);}
.ncard-sum{font-size:13px;color:var(--cream);line-height:1.4;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.ncard-foot{display:flex;align-items:center;justify-content:space-between;margin-top:6px;}
.ncard-tasks{font-size:10px;color:var(--green);}
.ncard-tags{font-size:9px;color:var(--muted);display:flex;gap:4px;flex-wrap:wrap;}
.ncard-tags span{background:rgba(255,255,255,.06);padding:1px 6px;border-radius:8px;}
.empty-state{text-align:center;padding:50px 20px;color:var(--muted);font-style:italic;grid-column:1/-1;}
.spinner{width:22px;height:22px;border:3px solid rgba(240,165,0,.2);border-top-color:var(--gold);border-radius:50%;animation:chsSpin .8s linear infinite;display:inline-block;}

/* MODAL */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);z-index:50;display:none;align-items:center;justify-content:center;padding:20px;}
.modal.open{display:flex;}
.mbox{background:#20060f;border:1px solid var(--gold);border-radius:14px;max-width:760px;width:100%;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.8);}
.mhead{padding:15px 20px;border-bottom:1px solid rgba(240,165,0,.25);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;background:linear-gradient(135deg,var(--burg),#2A0812);}
.mtitle{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1.5px;color:var(--gold);}
.msub{font-size:11px;color:var(--muted);margin-top:3px;}
.mclose{background:none;border:none;color:var(--cream);font-size:26px;cursor:pointer;padding:0;line-height:1;opacity:.65;}
.mclose:hover{opacity:1;}
.mbody{flex:1;overflow-y:auto;padding:18px 20px;}
.mbody h4{font-size:9px;letter-spacing:1.8px;color:var(--muted);font-weight:800;text-transform:uppercase;margin:12px 0 6px;}
.mbody h4:first-child{margin-top:0;}
.mbody .raw{background:rgba(0,0,0,.3);border:1px solid rgba(240,165,0,.12);border-radius:8px;padding:12px 14px;font-size:13px;line-height:1.6;color:var(--cream);white-space:pre-wrap;}
.mbody .sum{background:rgba(240,165,0,.08);border:1px solid rgba(240,165,0,.25);border-radius:8px;padding:12px 14px;font-size:13px;line-height:1.5;color:var(--cream);}
.mfoot{padding:12px 20px;border-top:1px solid rgba(240,165,0,.15);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:rgba(0,0,0,.3);}
.mfoot-left{display:flex;gap:8px;}

@media (max-width:640px){
  .bn{font-size:18px;}
  .bt{display:none;}
  main{padding:12px;}
  .f-in{min-width:140px;}
  .grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<header>
  <div class="hl">
    <a class="back" href="/">← Dashboard</a>
    <div>
      <div class="bn">🧠 Smart Notes</div>
      <div class="bt">Columbus Home Solutions · Knowledge Base</div>
    </div>
  </div>
  <div class="hr">
    <button class="rfb" id="refresh-btn" title="Refresh">⟳</button>
  </div>
</header>

<main>

  <div class="write">
    <h2>New Note</h2>
    <textarea class="w-input" id="sn-input" placeholder="Write a note… Claude will summarize, extract tasks, and save automatically."></textarea>
    <div class="w-row">
      <select class="w-cat" id="sn-cat">
        <option value="">Category</option>
        <option>Job</option><option>Admin</option><option>Finance</option>
        <option>Follow Up</option><option>Marketing</option><option>Personal</option><option>Meeting</option>
      </select>
      <button class="w-btn primary" id="sn-process">✨ Process with Claude</button>
      <button class="w-btn secondary" id="sn-save">💾 Save Only</button>
    </div>
    <div class="w-progress" id="sn-progress">
      <div style="display:flex;align-items:center;gap:10px;font-size:12px;color:var(--gold);font-weight:700;"><span class="spinner"></span><span id="sn-status">Claude is reading…</span></div>
      <div class="w-bar"><div class="w-bar-fill" id="sn-bar"></div></div>
    </div>
    <div class="w-result" id="sn-result">
      <h4>✨ Summary</h4>
      <p id="sn-summary"></p>
      <div id="sn-tasks" style="display:none;">
        <h4>✅ Tasks Extracted</h4>
        <div id="sn-task-list"></div>
      </div>
    </div>
  </div>

  <div class="filters">
    <span class="f-lbl">Show</span>
    <span class="f-tab active" data-tab="active">Active</span>
    <span class="f-tab" data-tab="archived">Archived</span>
    <span class="f-tab" data-tab="all">All</span>
    <span class="f-lbl" style="margin-left:6px;">Category</span>
    <select class="f-sel" id="f-cat">
      <option value="">All</option>
      <option>Job</option><option>Admin</option><option>Finance</option>
      <option>Follow Up</option><option>Marketing</option><option>Personal</option><option>Meeting</option><option>General</option>
    </select>
    <span class="f-lbl">Since</span>
    <select class="f-sel" id="f-range">
      <option value="">Any time</option>
      <option value="7">Last 7 days</option>
      <option value="30" selected>Last 30 days</option>
      <option value="90">Last 90 days</option>
      <option value="365">Last year</option>
    </select>
    <span class="f-lbl">Search</span>
    <input class="f-in" id="f-q" type="text" placeholder="Text, tags, category…" autocomplete="off">
    <button class="f-btn danger" id="f-clear">Clear</button>
    <span class="f-spacer"></span>
    <span id="f-count" style="font-size:11px;color:var(--muted);"></span>
  </div>

  <div class="grid" id="notes-grid"><div class="empty-state"><span class="spinner"></span> Loading…</div></div>

</main>

<div class="modal" id="modal">
  <div class="mbox">
    <div class="mhead">
      <div>
        <div class="mtitle" id="m-title">Note</div>
        <div class="msub" id="m-sub">—</div>
      </div>
      <button class="mclose" id="m-close">×</button>
    </div>
    <div class="mbody" id="m-body">—</div>
    <div class="mfoot" id="m-foot"></div>
  </div>
</div>

<script>
(function(){
  const API = '/api/notes';
  const CLAUDE = 'https://chs-claude-proxy.tony-bc5.workers.dev';
  let STATE = { tab: 'active', cat: '', range: '30', q: '' };
  let NOTES = [];

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtDate = iso => { try { return new Date(iso).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}); } catch(e){ return ''; } };
  const fmtTime = iso => { try { return new Date(iso).toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit'}); } catch(e){ return ''; } };
  const catClass = c => 'cat-' + String(c || 'General').replace(/\s/g,'\\ ');

  async function load(){
    const qs = new URLSearchParams({status: STATE.tab});
    if(STATE.cat) qs.set('category', STATE.cat);
    if(STATE.range){
      const d = new Date(); d.setDate(d.getDate() - Number(STATE.range));
      qs.set('since', d.toISOString());
    }
    try {
      const r = await fetch(API + '?' + qs.toString());
      if(!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      NOTES = data.notes || [];
      render();
    } catch(err){
      $('notes-grid').innerHTML = '<div class="empty-state">Failed to load: ' + esc(err.message) + '</div>';
    }
  }

  function render(){
    const q = STATE.q.toLowerCase();
    let view = NOTES;
    if(q){
      view = view.filter(n => {
        const hay = [n.raw_text, n.summary||'', n.category||'', (n.tags||[]).join(' ')].join(' ').toLowerCase();
        return hay.includes(q);
      });
    }
    $('f-count').textContent = view.length + ' note' + (view.length === 1 ? '' : 's');
    if(!view.length){
      $('notes-grid').innerHTML = '<div class="empty-state">No notes match. Try a different filter or write one above.</div>';
      return;
    }
    $('notes-grid').innerHTML = view.map(n => {
      const summary = n.summary || (n.raw_text || '').substring(0,160) + ((n.raw_text||'').length > 160 ? '…' : '');
      const date = fmtDate(n.created_at);
      const time = fmtTime(n.created_at);
      const archived = n.status === 'archived' ? ' archived' : '';
      const tags = (n.tags || []).slice(0,4).map(t => '<span>' + esc(t) + '</span>').join('');
      const tasks = (n.task_count || 0) > 0 ? '<span class="ncard-tasks">✅ ' + n.task_count + ' task' + (n.task_count>1?'s':'') + '</span>' : '';
      return '<div class="ncard' + archived + '" data-id="' + esc(n.id) + '">' +
        '<div class="ncard-head">' +
          '<span class="cat-pill ' + catClass(n.category) + '">' + esc(n.category || 'General') + '</span>' +
          '<span class="ncard-meta">' + date + ' · ' + time + '</span>' +
        '</div>' +
        '<div class="ncard-sum">' + esc(summary) + '</div>' +
        (tags || tasks ? '<div class="ncard-foot"><div class="ncard-tags">' + tags + '</div>' + tasks + '</div>' : '') +
      '</div>';
    }).join('');
  }

  $('notes-grid').addEventListener('click', e => {
    const card = e.target.closest('.ncard');
    if(!card) return;
    openModal(card.getAttribute('data-id'));
  });

  function openModal(id){
    const n = NOTES.find(x => x.id === id);
    if(!n) return;
    $('m-title').textContent = (n.category || 'General') + ' Note';
    $('m-sub').textContent = fmtDate(n.created_at) + ' · ' + fmtTime(n.created_at) + (n.meeting_source ? ' · from ' + n.meeting_source : '');
    const tasksHtml = (n.tasks_extracted && n.tasks_extracted.length)
      ? n.tasks_extracted.map(t => {
          const col = t.priority === 'high' ? '#e05252' : t.priority === 'med' ? '#E8722A' : '#52c07a';
          return '<div class="task-chip"><span class="dot" style="background:' + col + '"></span><span style="flex:1;font-weight:700;">' + esc(t.title || '') + '</span>' + (t.due && t.due !== 'null' ? '<span style="font-size:10px;color:var(--muted)">📅 ' + esc(t.due) + '</span>' : '') + '</div>';
        }).join('')
      : '';
    const tagsHtml = (n.tags && n.tags.length)
      ? n.tags.map(t => '<span style="display:inline-block;background:rgba(255,255,255,.06);padding:2px 8px;border-radius:10px;margin-right:4px;font-size:11px;">' + esc(t) + '</span>').join('')
      : '<span style="color:var(--muted);font-size:11px;">—</span>';
    $('m-body').innerHTML =
      (n.summary ? '<h4>✨ Summary</h4><div class="sum">' + esc(n.summary) + '</div>' : '') +
      (tasksHtml ? '<h4>✅ Extracted Tasks</h4>' + tasksHtml : '') +
      '<h4>🏷️ Tags</h4>' + tagsHtml +
      '<h4>📝 Full Note</h4><div class="raw">' + esc(n.raw_text || '') + '</div>';

    const archived = n.status === 'archived';
    $('m-foot').innerHTML =
      '<div class="mfoot-left">' +
        (archived
          ? '<button class="w-btn secondary" data-act="restore">↩ Restore</button>'
          : '<button class="w-btn secondary" data-act="archive">📦 Archive</button>'
        ) +
        '<button class="w-btn secondary" data-act="delete" style="background:rgba(224,82,82,.1);border-color:rgba(224,82,82,.3);color:var(--red);">🗑 Delete</button>' +
      '</div>' +
      '<button class="w-btn secondary" data-act="close">Close</button>';

    $('m-foot').querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => handleModalAction(btn.getAttribute('data-act'), n.id));
    });

    $('modal').classList.add('open');
  }

  async function handleModalAction(act, id){
    if(act === 'close'){ $('modal').classList.remove('open'); return; }
    if(act === 'archive' || act === 'restore'){
      await fetch(API + '/' + encodeURIComponent(id), {
        method: 'PATCH', headers: {'content-type':'application/json'},
        body: JSON.stringify({ status: act === 'archive' ? 'archived' : 'active' })
      });
      $('modal').classList.remove('open');
      await load();
      return;
    }
    if(act === 'delete'){
      if(!confirm('Delete this note permanently?')) return;
      await fetch(API + '/' + encodeURIComponent(id), { method: 'DELETE' });
      $('modal').classList.remove('open');
      await load();
    }
  }

  $('m-close').addEventListener('click', () => $('modal').classList.remove('open'));
  $('modal').addEventListener('click', e => { if(e.target === $('modal')) $('modal').classList.remove('open'); });
  document.addEventListener('keydown', e => { if(e.key === 'Escape') $('modal').classList.remove('open'); });

  // Filter wiring
  document.querySelectorAll('.f-tab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.f-tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    STATE.tab = t.getAttribute('data-tab');
    load();
  }));
  $('f-cat').addEventListener('change', () => { STATE.cat = $('f-cat').value; load(); });
  $('f-range').addEventListener('change', () => { STATE.range = $('f-range').value; load(); });
  let qDeb;
  $('f-q').addEventListener('input', () => { clearTimeout(qDeb); qDeb = setTimeout(() => { STATE.q = $('f-q').value; render(); }, 180); });
  $('f-clear').addEventListener('click', () => {
    STATE.tab = 'active'; STATE.cat = ''; STATE.range = '30'; STATE.q = '';
    document.querySelectorAll('.f-tab').forEach(x => x.classList.toggle('active', x.getAttribute('data-tab') === 'active'));
    $('f-cat').value = ''; $('f-range').value = '30'; $('f-q').value = '';
    load();
  });

  // Write flow
  function setProg(pct, txt){ $('sn-bar').style.width = pct + '%'; if(txt) $('sn-status').textContent = txt; }

  async function processNote(useClaud){
    const text = $('sn-input').value.trim();
    if(!text){ alert('Please write a note first.'); return; }
    const cat = $('sn-cat').value || 'General';
    const btn = $('sn-process'); const saveBtn = $('sn-save');
    btn.disabled = true; saveBtn.disabled = true;
    $('sn-result').classList.remove('open');

    let summary = null, tags = [], tasks = [];

    if(useClaud){
      $('sn-progress').classList.add('open');
      setProg(15, 'Claude is reading…');
      try {
        setProg(35, 'Summarizing and extracting tasks…');
        const today = new Date().toISOString().split('T')[0];
        const res = await fetch(CLAUDE, {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({
            model: 'claude-sonnet-4-20250514',
            max_tokens: 1000,
            system: 'You are a business assistant for Columbus Home Solutions. Analyze notes and return ONLY a JSON object with no other text:\n{\n  "summary": "2-3 sentence summary",\n  "tags": ["tag1","tag2"],\n  "tasks": [\n    {"title":"task","due":"YYYY-MM-DD or null","priority":"high|med|low","category":"Job|Admin|Finance|Follow Up|Marketing|Personal"}\n  ]\n}\nFor due dates: "today" = ' + today + '. Infer reasonable due dates from context. Return [] for tasks if none found.',
            messages: [{role:'user', content:'Note category: ' + cat + '\n\nNote:\n' + text}]
          })
        });
        const data = await res.json();
        const raw = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
        const parsed = JSON.parse(raw.replace(/```json|```/g,'').trim());
        summary = parsed.summary || null;
        tags = parsed.tags || [];
        tasks = parsed.tasks || [];
        setProg(85, 'Saving to cloud…');
      } catch(e){
        console.warn('Claude error, saving raw:', e);
        setProg(75, 'Claude unavailable — saving raw note');
      }
    } else {
      $('sn-progress').classList.add('open');
      setProg(75, 'Saving…');
    }

    try {
      const save = await fetch(API, {
        method: 'POST', headers: {'content-type':'application/json'},
        body: JSON.stringify({
          category: cat, raw_text: text,
          summary: summary, tags: tags, tasks_extracted: tasks, task_count: tasks.length
        })
      });
      if(!save.ok) throw new Error('HTTP ' + save.status);
      setProg(100, 'Done!');
      $('sn-input').value = ''; $('sn-cat').value = '';

      if(summary || tasks.length){
        $('sn-result').classList.add('open');
        $('sn-summary').textContent = summary || '(No summary)';
        if(tasks.length){
          $('sn-tasks').style.display = 'block';
          $('sn-task-list').innerHTML = tasks.map(t => {
            const col = t.priority === 'high' ? '#e05252' : t.priority === 'med' ? '#E8722A' : '#52c07a';
            return '<div class="task-chip"><span class="dot" style="background:' + col + '"></span><span style="flex:1;font-weight:700;">' + esc(t.title) + '</span>' + (t.due && t.due !== 'null' ? '<span style="font-size:10px;color:var(--muted)">📅 ' + esc(t.due) + '</span>' : '') + '</div>';
          }).join('');
        } else {
          $('sn-tasks').style.display = 'none';
        }
      }

      setTimeout(() => {
        $('sn-progress').classList.remove('open');
        setTimeout(() => $('sn-result').classList.remove('open'), 10000);
      }, 500);

      await load();
    } catch(e){
      alert('Save failed: ' + e.message);
    } finally {
      btn.disabled = false; saveBtn.disabled = false;
    }
  }

  $('sn-process').addEventListener('click', () => processNote(true));
  $('sn-save').addEventListener('click', () => processNote(false));

  $('refresh-btn').addEventListener('click', async () => {
    const btn = $('refresh-btn'); if(btn.classList.contains('spin')) return;
    btn.classList.add('spin'); btn.innerHTML = '<span class="rfb-ico">⟳</span>';
    const t0 = Date.now();
    try { await load(); } catch(e){}
    const wait = Math.max(0, 500 - (Date.now() - t0));
    setTimeout(() => {
      btn.classList.remove('spin'); btn.classList.add('ok'); btn.textContent = '✓';
      setTimeout(() => { btn.classList.remove('ok'); btn.textContent = '⟳'; }, 1100);
    }, wait);
  });

  load();
})();
</script>
</body>
</html>
